name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: Engine (FastAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: eva-engine
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Matches the container image. SciPy/NumPy ship manylinux wheels for
          # 3.12, so no compiler toolchain is needed.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: eva-engine/requirements-docker.txt

      - run: pip install -r requirements-docker.txt

      - name: Import check
        run: python -c "import main; print('engine imports OK')"

      - name: Statistical regression — reference values from the papers
        run: python test_engine.py

      - name: Goodness-of-fit sanity
        # A sample drawn from a true Gumbel must pass its own AD test, and
        # heavily quantised data must be flagged as inapplicable rather than
        # silently reported as a rejection.
        run: |
          python - <<'PY'
          import numpy as np
          from app.statistics.ad_multi import run_multi_distribution_ad_test

          rng = np.random.default_rng(1)
          clean = (0.3354 - 0.0402 * np.log(-np.log(rng.uniform(0, 1, 259)))).tolist()
          r = run_multi_distribution_ad_test(clean)
          g = next(x for x in r["results"] if x["distribution"] == "Gumbel")
          assert g["passed"], f"true Gumbel sample failed its own AD test: A2={g['ad_statistic']}"
          assert not r["is_discretized"], "continuous data wrongly flagged as discretised"
          assert r["gof_applicable"], "continuous data wrongly marked inapplicable"

          banded = (np.round(np.array(clean) / 0.211) * 0.211).tolist()
          rb = run_multi_distribution_ad_test(banded)
          assert rb["is_discretized"], "10% banded data not flagged as discretised"
          assert not rb["gof_applicable"], "banded data should be marked inapplicable"

          # p-values must never be floored: the START 2003-5 reference case is
          # 6e-07, which the old max(p, 1e-4) clamp made unreachable.
          from app.statistics.ad_multi import _osl
          assert abs(_osl(2.9227) - 6.0e-07) < 1e-08, f"OSL drifted: {_osl(2.9227)}"
          assert abs(_osl(0.4104) - 0.3466) < 1e-03, f"OSL drifted: {_osl(0.4104)}"
          print("goodness-of-fit sanity OK")
          PY

  backend:
    name: Backend (NestJS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      # The datasource block has no url (supplied at runtime by the driver
      # adapter), so this needs no DATABASE_URL.
      - name: Prisma generate
        run: npx prisma generate

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json

      - name: Build
        run: npm run build

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint .

      - name: Build
        env:
          # Inlined into the bundle at build time; a placeholder is fine here
          # because CI only proves the build compiles.
          NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
          NEXT_PUBLIC_EVA_ENGINE_URL: http://localhost:8000
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

  images:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [engine, backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build engine image
        uses: docker/build-push-action@v6
        with:
          context: ./eva-engine
          push: false
          cache-from: type=gha,scope=engine
          cache-to: type=gha,mode=max,scope=engine

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          build-args: |
            NEXT_PUBLIC_API_URL=http://localhost:3001/api/v1
            NEXT_PUBLIC_EVA_ENGINE_URL=http://localhost:8000
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
