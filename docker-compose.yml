# EVA platform — local / single-host deployment.
#
#   docker compose up --build
#
# Copy .env.example to .env first and set DATABASE_URL and JWT_SECRET.
#
# Service graph:
#   frontend (3000) ──browser──▶ backend (3001) ──▶ engine (8000)
#                                    └──▶ postgres (5432)
#
# Postgres runs here by default. To use a managed database instead (Neon, RDS),
# set DATABASE_URL to it in .env and start without the db service:
#   docker compose up -d engine backend frontend
#
# The browser talks to the backend over the published port, so the frontend is
# built with NEXT_PUBLIC_API_URL=http://localhost:3001/api/v1. Put this behind
# a reverse proxy on a real host and rebuild with the public URL instead.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-eva}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-eva}
    volumes:
      - eva-db:/var/lib/postgresql/data
    healthcheck:
      # Without -d the check passes before the application database exists,
      # letting the backend start against a server that is not ready for it.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-eva} -d ${POSTGRES_DB:-eva}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    # Not published: only the backend needs it, and exposing 5432 to the host
    # is the most common way these end up reachable from outside.
    networks:
      - eva

  engine:
    build:
      context: ./eva-engine
    image: eva-engine:latest
    restart: unless-stopped
    environment:
      # Monte Carlo + MLE are CPU-bound; raise alongside CPU limits.
      UVICORN_WORKERS: ${UVICORN_WORKERS:-1}
    # Not published by default — only the backend calls it. Uncomment to probe
    # /docs or run the verification scripts against it from the host.
    # ports:
    #   - "8000:8000"
    networks:
      - eva

  backend:
    build:
      context: ./backend
    image: eva-backend:latest
    restart: unless-stopped
    depends_on:
      engine:
        condition: service_healthy
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      # Defaults to the bundled Postgres; override in .env to point at a
      # managed database instead.
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-eva}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-eva}}
      DIRECT_URL: ${DIRECT_URL:-${DATABASE_URL:-postgresql://${POSTGRES_USER:-eva}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-eva}}}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      EVA_ENGINE_URL: http://engine:8000
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-50}
    volumes:
      # Uploaded CSVs and their -meta.json sidecars. Without this, every
      # dataset is lost when the container is replaced — and EvaRun rows keep
      # referencing files that no longer exist, so results pages break.
      - eva-uploads:/app/uploads
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    networks:
      - eva

  frontend:
    build:
      context: ./frontend
      args:
        # Build-time only. The browser resolves this, so it must be reachable
        # from the host — not the compose service name.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001/api/v1}
        NEXT_PUBLIC_EVA_ENGINE_URL: ${NEXT_PUBLIC_EVA_ENGINE_URL:-http://localhost:8000}
    image: eva-frontend:latest
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    networks:
      - eva

volumes:
  eva-uploads:
  eva-db:

networks:
  eva:
    driver: bridge
